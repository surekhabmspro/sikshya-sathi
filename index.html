<!doctype html>
<html lang="ne" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>शिक्षा साथी</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0F1A" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="शिक्षा साथी" />

    <!-- Fonts — Inter for Latin/numerals, Noto Sans Devanagari for Nepali
         script. Loaded here (not just @import'd inside App.jsx) so text is
         never rendered in the browser's fallback font, even for a split
         second: fallback Devanagari rendering on most OSes is thin, badly
         spaced, and hard to read, which was the single biggest readability
         problem in the app. preconnect speeds up the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- NEW — light/dark theme colors, defined here (not just inside App.jsx)
         so they exist from the very first paint: the login screen and the
         loading spinner render before React finishes mounting the themed
         wrapper, and would otherwise have no colors to use at all.
         Slightly richer/deeper palette than before, plus a subtle two-tone
         backdrop gradient instead of a flat fill, for a less "flat html
         page" and more "designed app" first impression. -->
    <style>
      *{box-sizing:border-box;}
      body{margin:0;-webkit-font-smoothing:antialiased;}
      [data-theme="light"]{
        --bg:#F7F4EB; --bg-grad:#ECE4CD; --surface:#FFFFFF; --surface-2:#FBF8EF;
        --ink:#141B2E; --ink-soft:#5B6478; --border:#E1DCC8;
        --accent:#20388F; --accent-dark:#152867; --accent-light:#E4E9F8;
        --marigold:#C98A1E; --marigold-dark:#9C6B12;
        --teal:#1B8C82; --teal-light:#E1F2F0;
        --violet:#7259B5; --violet-light:#EFE9FA;
        --blue:#3167B0; --blue-light:#E7EEFA;
        --rose:#B85C78; --rose-light:#F7E7ED;
        --danger:#B3261E; --danger-bg:#FBEAE6;
        --warn:#9C6B12; --warn-bg:#FBF0DA;
        --shadow-rgb:15,19,36;
        --card-sheen:rgba(255,255,255,0.8);
      }
      [data-theme="dark"]{
        --bg:#0B0F1A; --bg-grad:#121A2E; --surface:#161F33; --surface-2:#1E2A44;
        --ink:#EEF1F8; --ink-soft:#9AA3BD; --border:#2A3552;
        --accent:#4C6FE0; --accent-dark:#3050C4; --accent-light:#1B2647;
        --marigold:#F5A93F; --marigold-dark:#D68A1E;
        --teal:#3FB8C9; --teal-light:#122D36;
        --violet:#A98CE8; --violet-light:#241B3E;
        --blue:#5C93EA; --blue-light:#152540;
        --rose:#E88CA0; --rose-light:#3A1F2A;
        --danger:#F0685A; --danger-bg:#3A1E1A;
        --warn:#E8A23A; --warn-bg:#3A2A12;
        --shadow-rgb:2,4,12;
        --card-sheen:rgba(255,255,255,0.07);
      }
      [data-theme="light"] { color-scheme: light; }
      [data-theme="dark"] { color-scheme: dark; }
      html, body {
        background: radial-gradient(1100px 620px at 12% -8%, var(--bg-grad), var(--bg) 55%);
        color: var(--ink);
        font-family: 'Inter','Noto Sans Devanagari',sans-serif;
      }
      /* NEW — this stylesheet did not exist at all before, which is why
         printing produced a blank page: the .no-print class referenced
         throughout the app had no rule hiding it, and the printable
         overlays use position:fixed, which most browsers refuse to
         paginate onto printed pages (they just print blank). Elements
         tagged .print-area get reset to normal flow so their content
         actually reaches the page. */
      /* FIX — .print-area was correctly reset to normal document flow
         above, but the screen BEHIND it (.main-content — whatever list or
         form was open, e.g. the Planner's lesson list with its status
         pills and edit/print/delete icons) was never hidden. Since
         .print-area sits after .main-content in the page, both printed,
         .main-content first — that's the stray "boxes" that showed up
         above the actual lesson content on every printout. */
      .print-only { display:none; }
      @media print {
        @page { margin: 1.6cm 1.4cm; }
        .no-print { display:none !important; }
        .print-only { display:block !important; }
        .main-content, .desktop-sidebar, .mobile-bottom-nav { display:none !important; }
        .print-area {
          position: static !important;
          inset: auto !important;
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
          background: #fff !important;
          color: #000 !important;
        }
        .print-area * { overflow: visible !important; color: #000 !important; }
        html, body { background:#fff !important; }
      }
    </style>
    <script>
      // Apply the saved theme choice immediately, before React loads, so
      // there's no flash of the wrong theme on page refresh.
      try {
        var saved = localStorage.getItem("ss-theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    </script>
    <script>
      // NEW — the app had a manifest.json (installable) but no service
      // worker at all, so nothing was ever cached and it simply failed
      // with no network. This registers sw.js (put it in /public so it's
      // served from the site root — required for its scope to cover the
      // whole app).
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

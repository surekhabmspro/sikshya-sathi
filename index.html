<!doctype html>
<html lang="ne" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>शिक्षा साथी</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1F4D3D" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="शिक्षा साथी" />

    <!-- Fonts — Inter for Latin/numerals, Noto Sans Devanagari for Nepali
         script. Loaded here (not just @import'd inside App.jsx) so text is
         never rendered in the browser's fallback font, even for a split
         second: fallback Devanagari rendering on most OSes is thin, badly
         spaced, and hard to read, which was the single biggest readability
         problem in the app. preconnect speeds up the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- NEW — light/dark theme colors, defined here (not just inside App.jsx)
         so they exist from the very first paint: the login screen and the
         loading spinner render before React finishes mounting the themed
         wrapper, and would otherwise have no colors to use at all.
         Slightly richer/deeper palette than before, plus a subtle two-tone
         backdrop gradient instead of a flat fill, for a less "flat html
         page" and more "designed app" first impression. -->
    <style>
      *{box-sizing:border-box;}
      body{margin:0;-webkit-font-smoothing:antialiased;}
      [data-theme="light"]{
        --bg:#F6F3EA; --bg-grad:#EFE9D8; --surface:#FFFFFF; --surface-2:#FDFBF6;
        --ink:#201D19; --ink-soft:#6B6557; --border:#E6E0D1;
        --accent:#164A38; --accent-dark:#0F3627; --accent-light:#E4F1EA;
        --marigold:#D98E2B; --marigold-dark:#B9741A;
        --teal:#0E8A87; --teal-light:#E1F5F3;
        --violet:#7A4FC2; --violet-light:#F0E9FA;
        --blue:#2E6FBE; --blue-light:#E8F1FC;
        --rose:#C4436B; --rose-light:#FBE9EF;
        --danger:#B3402C; --danger-bg:#FBEAE6;
        --warn:#9A5B12; --warn-bg:#FCF0DA;
        --shadow-rgb:32,29,25;
      }
      [data-theme="dark"]{
        --bg:#12171A; --bg-grad:#1A2225; --surface:#1D2427; --surface-2:#232B2E;
        --ink:#F1EEE7; --ink-soft:#A8A192; --border:#323B3E;
        --accent:#45BB9A; --accent-dark:#2C7C63; --accent-light:#1B332C;
        --marigold:#E8A44A; --marigold-dark:#C98A34;
        --teal:#3FC2BD; --teal-light:#173B39;
        --violet:#B294EE; --violet-light:#2B2242;
        --blue:#79ABEE; --blue-light:#1E2E42;
        --rose:#E58AA8; --rose-light:#3A2028;
        --danger:#E5715A; --danger-bg:#3A2320;
        --warn:#E0A94E; --warn-bg:#3A2E18;
        --shadow-rgb:0,0,0;
      }
      html, body {
        background: radial-gradient(1100px 620px at 12% -8%, var(--bg-grad), var(--bg) 55%);
        color: var(--ink);
        font-family: 'Inter','Noto Sans Devanagari',sans-serif;
      }
    </style>
    <script>
      // Apply the saved theme choice immediately, before React loads, so
      // there's no flash of the wrong theme on page refresh.
      try {
        var saved = localStorage.getItem("ss-theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="ne" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>शिक्षा साथी</title>

    <!-- PWA — theme-color/background/icons all match the current warm
         palette now (was stale teal-green + navy left over from the very
         first version, which is why the OS/browser chrome around the app —
         title bar, splash screen, taskbar icon — still looked like the old
         design even after every in-app screen was redone). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1C1006" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/icon-64.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="शिक्षा साथी" />

    <!-- FIX — every font in the app must be only Kalimati (Devanagari) or
         Times New Roman (Latin), in-app and on print/PDF — no other font,
         ever. This used to load Google-hosted Hind/Baloo 2 and set them as
         the base body font here in <head>, which rendered (and briefly
         flashed, before React/App.jsx's own 'SSText' font-face mounted) a
         completely different typeface on every single load. Removed the
         Google Fonts import entirely and point straight at the two allowed,
         locally-installed fonts instead — see 'SSText' below and the
         matching @font-face pair inside App.jsx's own <style> block, which
         together are now the ONLY font stack used anywhere in the app. -->
    <style>
      @font-face{
        font-family:'SSText';
        src:local('Kalimati'),local('Kalimati Regular');
        unicode-range:U+0900-097F,U+0980-09FF,U+1CD0-1CFF,U+A8E0-A8FF,U+11B00-11B5F;
        font-display:swap;
      }
      @font-face{
        font-family:'SSText';
        src:local('Times New Roman'),local('Times'),local('Liberation Serif'),local('Nimbus Roman');
        unicode-range:U+0000-024F,U+0300-036F,U+2000-206F,U+2070-209F;
        font-display:swap;
      }
    </style>

    <!-- NEW — light/dark theme colors, defined here (not just inside App.jsx)
         so they exist from the very first paint: the login screen and the
         loading spinner render before React finishes mounting the themed
         wrapper, and would otherwise have no colors to use at all.
         Slightly richer/deeper palette than before, plus a subtle two-tone
         backdrop gradient instead of a flat fill, for a less "flat html
         page" and more "designed app" first impression. -->
    <style>
      *{box-sizing:border-box;}
      body{margin:0;-webkit-font-smoothing:antialiased;}
      [data-theme="light"]{
        --bg:#FFF7EA; --bg-grad:#FFE7BE; --surface:#FFFFFF; --surface-2:#FFF2DC;
        --ink:#2B1A0E; --ink-soft:#8A6D4E; --border:#F2DCB0;
        --accent:#E8590C; --accent-dark:#C2470A; --accent-light:#FFE3CC;
        --marigold:#F0A500; --marigold-dark:#C6870A;
        --teal:#0E9384; --teal-light:#D6F3EC;
        --violet:#7C3AED; --violet-light:#EDE3FE;
        --blue:#2563EB; --blue-light:#DDE7FE;
        --rose:#E11D74; --rose-light:#FCE0EC;
        --danger:#DC2626; --danger-bg:#FCE1DE;
        --warn:#D97706; --warn-bg:#FCEED0;
        --shadow-rgb:43,27,14;
        --card-sheen:rgba(255,255,255,0.85);
      }
      [data-theme="dark"]{
        --bg:#1C1006; --bg-grad:#2B1A0B; --surface:#241505; --surface-2:#301C0C;
        --ink:#FBEEDD; --ink-soft:#CBA97C; --border:#4A311A;
        --accent:#C96A35; --accent-dark:#A8501F; --accent-light:#3C2410;
        --marigold:#CBA054; --marigold-dark:#AD8434;
        --teal:#4C9C90; --teal-light:#0D332D;
        --violet:#8D7BC4; --violet-light:#2B1F49;
        --blue:#6C8CB8; --blue-light:#152A4A;
        --rose:#C97690; --rose-light:#3A1526;
        --danger:#C97060; --danger-bg:#3A1512;
        --warn:#C9A054; --warn-bg:#3A2A0A;
        --shadow-rgb:10,6,2;
        --card-sheen:rgba(255,255,255,0.05);
      }
      [data-theme="light"] { color-scheme: light; }
      [data-theme="dark"] { color-scheme: dark; }
      html, body {
        background: radial-gradient(1100px 620px at 12% -8%, var(--bg-grad), var(--bg) 55%);
        color: var(--ink);
        font-family: 'SSText','Kalimati','Times New Roman',serif;
      }
      .ss-display { font-family: 'SSText','Kalimati','Times New Roman',serif; }
      /* NEW — this stylesheet did not exist at all before, which is why
         printing produced a blank page: the .no-print class referenced
         throughout the app had no rule hiding it, and the printable
         overlays use position:fixed, which most browsers refuse to
         paginate onto printed pages (they just print blank). Elements
         tagged .print-area get reset to normal flow so their content
         actually reaches the page. */
      /* FIX — .print-area was correctly reset to normal document flow
         above, but the screen BEHIND it (.main-content — whatever list or
         form was open, e.g. the Planner's lesson list with its status
         pills and edit/print/delete icons) was never hidden. Since
         .print-area sits after .main-content in the page, both printed,
         .main-content first — that's the stray "boxes" that showed up
         above the actual lesson content on every printout. */
      .print-only { display:none; }
      @media print {
        @page { margin: 1.6cm 1.4cm; }
        .no-print { display:none !important; }
        .print-only { display:block !important; }
        .main-content, .desktop-sidebar, .mobile-bottom-nav { display:none !important; }
        .print-area {
          position: static !important;
          inset: auto !important;
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
          background: #fff !important;
          color: #000 !important;
        }
        .print-area * { overflow: visible !important; color: #000 !important; font-family: 'SSText','Kalimati','Times New Roman',serif !important; }
        html, body { background:#fff !important; }
      }
    </style>
    <script>
      // Apply the saved theme choice immediately, before React loads, so
      // there's no flash of the wrong theme on page refresh.
      try {
        var saved = localStorage.getItem("ss-theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    </script>
    <!-- FIX — the service worker used to be registered here AND separately
         in main.jsx (which also handles reloading when a new version is
         deployed). Registering twice wasn't harmful on its own, but
         main.jsx is the one real place for this logic — duplicate removed. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
